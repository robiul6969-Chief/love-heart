<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at center,
        #3b102e 0%,
        #160918 32%,
        #050208 72%,
        #000 100%);
    font-family:Arial,sans-serif;
    perspective:1200px;
}

/* BACKGROUND GLOW */

.bgGlow{
    position:fixed;
    width:650px;
    height:650px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(255,40,150,.24),
        rgba(180,0,100,.08) 40%,
        transparent 70%
    );

    filter:blur(25px);
    animation:bgPulse 4s ease-in-out infinite;
}

@keyframes bgPulse{
    0%,100%{transform:translate(-50%,-50%) scale(.9)}
    50%{transform:translate(-50%,-50%) scale(1.15)}
}


/* TITLE */

.title{
    position:fixed;
    top:28px;
    left:50%;
    transform:translateX(-50%);

    z-index:20;

    font-size:clamp(25px,4vw,45px);
    font-weight:bold;
    letter-spacing:2px;

    white-space:nowrap;

    background:linear-gradient(
        90deg,
        #ff4f9a,
        #fff,
        #ff65ad
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:drop-shadow(0 0 15px #ff3f9f);
}


/* ROTATING HEART SCENE */

.scene{
    position:absolute;

    left:50%;
    top:53%;

    width:min(650px,90vw);
    height:min(650px,75vh);

    transform:
        translate(-50%,-50%)
        rotateX(0deg)
        rotateY(0deg);
}


/*
    THIS IS THE IMPORTANT PART

    Thousands of I LOVE YOU stay together
    and the WHOLE group rotates.
*/

.heart{
    position:absolute;

    width:100%;
    height:100%;

    left:0;
    top:0;

    transform-style:preserve-3d;

    animation:
        rotateHeart 12s linear infinite,
        heartBeat 2.2s ease-in-out infinite;
}


@keyframes rotateHeart{

    0%{
        transform:rotateZ(0deg) rotateY(0deg);
    }

    25%{
        transform:rotateZ(90deg) rotateY(12deg);
    }

    50%{
        transform:rotateZ(180deg) rotateY(0deg);
    }

    75%{
        transform:rotateZ(270deg) rotateY(-12deg);
    }

    100%{
        transform:rotateZ(360deg) rotateY(0deg);
    }
}


@keyframes heartBeat{

    0%,100%{
        scale:1;
    }

    50%{
        scale:1.045;
    }
}


/* EACH I LOVE YOU */

.love{
    position:absolute;

    color:#ffb6da;

    font-size:10px;
    font-weight:bold;

    white-space:nowrap;

    transform-style:preserve-3d;

    text-shadow:
        0 0 4px #ff69b4,
        0 0 8px #ff1493,
        0 0 15px #ff1493,
        0 0 25px rgba(255,20,147,.8);

    opacity:.85;

    transition:opacity .3s;

    animation:textGlow 1.8s ease-in-out infinite alternate;
}


@keyframes textGlow{

    from{
        opacity:.45;
    }

    to{
        opacity:1;
    }
}


/* CENTER */

.center{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    text-align:center;

    pointer-events:none;
}

.center h1{

    font-size:clamp(28px,6vw,60px);

    letter-spacing:3px;

    background:linear-gradient(
        135deg,
        white,
        #ffb6da,
        #ff3f9f
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(0 0 8px #ff1493)
        drop-shadow(0 0 25px #ff1493);
}

.center p{

    margin-top:8px;

    color:rgba(255,255,255,.65);

    font-size:11px;

    letter-spacing:5px;
}


/* PARTICLES */

.particle{

    position:fixed;

    border-radius:50%;

    background:#ff7fbd;

    box-shadow:
        0 0 7px #ff1493,
        0 0 15px #ff1493;

    pointer-events:none;

    animation:floatUp linear infinite;
}

@keyframes floatUp{

    from{
        transform:translateY(110vh);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}


/* FOOTER */

.footer{

    position:fixed;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    color:rgba(255,255,255,.35);

    font-size:10px;

    letter-spacing:3px;

    white-space:nowrap;
}


/* MOBILE */

@media(max-width:600px){

    .scene{
        width:105vw;
        height:65vh;
    }

    .love{
        font-size:7px;
    }

    .center h1{
        font-size:30px;
    }

    .center p{
        font-size:8px;
        letter-spacing:3px;
    }

}
</style>
</head>

<body>

<div class="bgGlow"></div>

<div class="title">
    I Love You ❤️
</div>


<div class="scene" id="scene">

    <div class="heart" id="heart">

        <div class="center">
            <h1>I LOVE YOU</h1>
            <p>FOREVER • ALWAYS • ❤️</p>
        </div>

    </div>

</div>


<div class="footer">
    MADE WITH LOVE ✨
</div>


<script>

/* =========================================
   CREATE THE CONNECTED HEART
========================================= */

const heart = document.getElementById("heart");

const total = 850;

const width = heart.clientWidth;
const height = heart.clientHeight;

const centerX = width / 2;
const centerY = height / 2;

const scale = Math.min(width,height) / 38;


/*
   Mathematical heart
*/

for(let i=0;i<total;i++){

    const t =
        Math.PI * 2 * i / total;


    const x =
        16 * Math.pow(Math.sin(t),3);


    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);


    /*
       Add several layers.
       This makes the heart look like
       thousands of words are tied together.
    */

    const layer =
        (i % 7) - 3;


    const xPos =
        centerX +
        x * scale +
        layer * 1.7;


    const yPos =
        centerY -
        y * scale +
        layer * 1.7;


    const love =
        document.createElement("div");


    love.className="love";


    love.innerHTML =
        i % 5 === 0
        ? "I LOVE YOU ❤️"
        : "I love you";


    love.style.left =
        xPos+"px";


    love.style.top =
        yPos+"px";


    /*
       Follow the heart curve
    */

    const angle =
        Math.atan2(y,x) *
        180 / Math.PI;


    love.style.transform =
        `
        translate(-50%,-50%)
        rotate(${angle+90}deg)
        translateZ(${layer*5}px)
        `;


    /*
       Slightly different glow timing
    */

    love.style.animationDelay =
        (Math.random()*2)+"s";


    heart.appendChild(love);
}


/* =========================================
   FLOATING PARTICLES
========================================= */

for(let i=0;i<100;i++){

    const p =
        document.createElement("div");

    p.className="particle";

    p.style.left =
        Math.random()*100+"vw";

    const size =
        1 + Math.random()*4;

    p.style.width=size+"px";
    p.style.height=size+"px";

    p.style.animationDuration =
        5 + Math.random()*12+"s";

    p.style.animationDelay =
        -Math.random()*15+"s";

    document.body.appendChild(p);
}


/* =========================================
   MOUSE 3D CONTROL
========================================= */

const scene =
    document.getElementById("scene");


document.addEventListener(
    "mousemove",
    e => {

        const x =
            (e.clientX /
            window.innerWidth - .5);


        const y =
            (e.clientY /
            window.innerHeight - .5);


        scene.style.transform =
            `
            translate(-50%,-50%)
            rotateX(${-y*12}deg)
            rotateY(${x*12}deg)
            `;
    }
);


/* =========================================
   TOUCH CONTROL
========================================= */

document.addEventListener(
    "touchmove",
    e => {

        const touch =
            e.touches[0];


        const x =
            touch.clientX /
            window.innerWidth - .5;


        const y =
            touch.clientY /
            window.innerHeight - .5;


        scene.style.transform =
            `
            translate(-50%,-50%)
            rotateX(${-y*8}deg)
            rotateY(${x*8}deg)
            `;
    },
    {passive:true}
);

</script>

</body>
</html>
