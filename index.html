<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 48%,
            #310b29 0%,
            #150713 35%,
            #050205 72%,
            #000 100%
        );

    font-family:Arial, sans-serif;
    color:white;
}


/* ================= BACKGROUND ================= */

.bg-glow{
    position:fixed;
    width:700px;
    height:700px;

    left:50%;
    top:52%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,20,147,.22),
            rgba(255,20,147,.08) 40%,
            transparent 70%
        );

    filter:blur(25px);

    animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(.92);
    }

    50%{
        transform:translate(-50%,-50%) scale(1.08);
    }
}


/* ================= TOP TITLE ================= */

.title{
    position:fixed;

    top:28px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    white-space:nowrap;

    font-size:clamp(27px,4vw,46px);

    font-weight:bold;

    letter-spacing:2px;

    background:
        linear-gradient(
            90deg,
            #ff4d9d,
            #ffffff,
            #ff4d9d
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(0 0 10px #ff1493)
        drop-shadow(0 0 25px #ff1493);
}


/* ================= HEART ================= */

.scene{
    position:absolute;

    width:min(700px,92vw);
    height:min(680px,76vh);

    left:50%;
    top:53%;

    transform:translate(-50%,-50%);
}

.heart{
    position:absolute;

    width:100%;
    height:100%;

    left:0;
    top:0;
}


/* ================= SMALL I LOVE YOU ================= */

.love{
    position:absolute;

    white-space:nowrap;

    transform:
        translate(-50%,-50%) !important;

    color:#ffb9dc;

    font-size:10px;

    font-weight:bold;

    letter-spacing:.1px;

    text-shadow:
        0 0 4px #ff69b4,
        0 0 9px #ff1493,
        0 0 17px #ff1493;

    pointer-events:none;

    user-select:none;
}


/* ================= CENTER ================= */

.center{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:20;

    width:100%;

    pointer-events:none;
}

.center h1{
    font-size:clamp(
        34px,
        6vw,
        64px
    );

    font-weight:bold;

    letter-spacing:4px;

    line-height:1.05;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #ffb7db,
            #ff3f9f
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(0 0 8px #ff1493)
        drop-shadow(0 0 24px #ff1493);
}

.center p{
    margin-top:13px;

    font-size:11px;

    letter-spacing:6px;

    color:rgba(255,255,255,.7);
}


/* ================= PARTICLES ================= */

.particle{
    position:fixed;

    border-radius:50%;

    background:#ff69b4;

    box-shadow:
        0 0 6px #ff1493,
        0 0 15px #ff1493;

    pointer-events:none;

    animation:
        floatUp linear infinite;
}

@keyframes floatUp{

    from{
        transform:translateY(110vh);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}


/* ================= PREMIUM CREDIT ================= */

.credit{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:13px;

    padding:10px 22px;

    min-width:260px;

    border:1px solid rgba(255,72,166,.65);

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,20,147,.14),
            rgba(255,255,255,.04)
        );

    box-shadow:
        0 0 10px rgba(255,20,147,.35),
        inset 0 0 15px rgba(255,20,147,.08);

    backdrop-filter:blur(10px);

    color:rgba(255,255,255,.72);

    font-size:10px;

    letter-spacing:3px;

    white-space:nowrap;
}

.credit .heart-icon{
    color:#ff4fa3;

    font-size:14px;

    filter:
        drop-shadow(0 0 6px #ff1493);

    animation:
        heartBeat 1.4s ease-in-out infinite;
}

.credit .name{
    color:#ff70b8;

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:
        0 0 7px #ff1493,
        0 0 15px rgba(255,20,147,.8);
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.25);
    }
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .scene{
        width:108vw;
        height:67vh;
    }

    .love{
        font-size:7px;
    }

    .center h1{
        font-size:31px;
    }

    .center p{
        font-size:8px;
        letter-spacing:3px;
    }

    .credit{
        bottom:12px;

        padding:8px 15px;

        min-width:auto;

        font-size:8px;

        letter-spacing:2px;
    }

    .credit .name{
        letter-spacing:3px;
    }
}
</style>
</head>

<body>


<!-- Background -->
<div class="bg-glow"></div>


<!-- Title -->
<div class="title">
    I Love You ❤️
</div>


<!-- Heart -->
<div class="scene">

    <div class="heart" id="heart">

        <!-- Center message -->
        <div class="center">

            <h1>
                I LOVE YOU
            </h1>

            <p>
                FOREVER • ALWAYS • ❤️
            </p>

        </div>

    </div>

</div>


<!-- Premium Credit -->
<div class="credit">

    <span class="heart-icon">♥</span>

    <span>
        MADE WITH LOVE BY
    </span>

    <span class="name">
        ROBIUL
    </span>

    <span class="heart-icon">♥</span>

</div>


<script>

/* =========================================
   HEART SETTINGS
========================================= */

const heart =
    document.getElementById("heart");

const total =
    900;


/* =========================================
   HEART DIMENSIONS
========================================= */

function setup(){

    const width =
        heart.clientWidth;

    const height =
        heart.clientHeight;

    const centerX =
        width / 2;

    const centerY =
        height / 2;

    const scale =
        Math.min(width,height) / 38;


    /* =====================================
       CREATE 900 SMALL I LOVE YOU
    ===================================== */

    const words=[];


    for(let i=0;i<total;i++){

        const love =
            document.createElement("div");

        love.className="love";

        love.textContent =
            i % 9 === 0
            ? "I LOVE YOU ♥"
            : "I love you";

        love.dataset.index=i;

        heart.appendChild(love);

        words.push(love);
    }


    /* =====================================
       HEART EQUATION
    ===================================== */

    function heartPosition(t){

        const x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );

        const y =
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t);

        return{

            x:
                centerX +
                x*scale,

            y:
                centerY -
                y*scale
        };
    }


    /* =====================================
       ANIMATION
       
       ONLY SMALL WORDS MOVE.

       HEART NEVER ROTATES.

       TEXT NEVER TURNS UPSIDE DOWN.
    ===================================== */

    let time=0;


    function animate(){

        time += 0.0017;


        words.forEach(
            (love,i)=>{

                const base =
                    (i/total) *
                    Math.PI*2;


                const t =
                    base + time;


                const pos =
                    heartPosition(t);


                /*
                   Tiny natural movement
                */

                const wave =
                    Math.sin(t*5)*1.2;


                love.style.left =
                    (pos.x+wave)+"px";


                love.style.top =
                    (pos.y+wave)+"px";


                /*
                   IMPORTANT:

                   Text stays straight.
                */

                love.style.transform =
                    "translate(-50%,-50%)";


                /*
                   Soft brightness variation
                */

                const glow =
                    .68 +
                    Math.sin(t*3)*.2;

                love.style.opacity =
                    glow;
            }
        );


        requestAnimationFrame(
            animate
        );
    }


    animate();
}


/* Start */
setup();


/* =========================================
   BACKGROUND PARTICLES
========================================= */

for(let i=0;i<120;i++){

    const particle =
        document.createElement("div");

    particle.className="particle";

    particle.style.left =
        Math.random()*100+"vw";


    const size =
        1+Math.random()*4;

    particle.style.width =
        size+"px";

    particle.style.height =
        size+"px";


    particle.style.animationDuration =
        6+Math.random()*12+"s";


    particle.style.animationDelay =
        -Math.random()*15+"s";


    document.body.appendChild(
        particle
    );
}

</script>

</body>
</html>
