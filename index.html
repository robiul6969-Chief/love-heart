<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 50%,
            #300b29 0%,
            #130611 38%,
            #050205 72%,
            #000000 100%
        );

    font-family:Arial,sans-serif;
    color:white;
}


/* ================= BACKGROUND GLOW ================= */

.glow{
    position:fixed;

    width:650px;
    height:650px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,20,147,.18),
            transparent 68%
        );

    filter:blur(30px);

    animation:glowPulse 5s ease-in-out infinite;
}

@keyframes glowPulse{

    0%,100%{
        opacity:.7;
        transform:translate(-50%,-50%) scale(.95);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.08);
    }
}


/* ================= TITLE ================= */

.title{
    position:fixed;

    top:28px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    white-space:nowrap;

    font-size:clamp(28px,4vw,46px);

    font-weight:bold;

    letter-spacing:2px;

    color:#ff7fbd;

    text-shadow:
        0 0 8px #ff1493,
        0 0 20px #ff1493,
        0 0 40px rgba(255,20,147,.7);
}


/* ================= HEART SCENE ================= */

.scene{

    position:absolute;

    width:min(720px,92vw);
    height:min(680px,78vh);

    left:50%;
    top:53%;

    transform:translate(-50%,-50%);
}


/* ================= HEART ================= */

.heart{

    position:absolute;

    width:100%;
    height:100%;

    left:0;
    top:0;
}


/* ================= SMALL WORDS ================= */

.love{

    position:absolute;

    white-space:nowrap;

    left:0;
    top:0;

    color:#ffb6dc;

    font-size:9px;

    font-weight:bold;

    letter-spacing:.15px;

    pointer-events:none;

    user-select:none;

    will-change:
        transform,
        opacity;

    transform-origin:center center;

    text-shadow:
        0 0 3px rgba(255,105,180,.9),
        0 0 7px rgba(255,20,147,.8);

    /*
       Very important:
       browser-ke smooth rendering
    */

    backface-visibility:hidden;

    -webkit-font-smoothing:antialiased;
}


/* ================= CENTER MESSAGE ================= */

.center{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:100%;

    text-align:center;

    z-index:50;

    pointer-events:none;
}

.center h1{

    font-size:clamp(
        34px,
        6vw,
        64px
    );

    letter-spacing:4px;

    font-weight:bold;

    color:#ffb4d9;

    text-shadow:
        0 0 8px #ff1493,
        0 0 20px #ff1493,
        0 0 45px rgba(255,20,147,.8);
}

.center p{

    margin-top:12px;

    font-size:10px;

    letter-spacing:6px;

    color:rgba(255,255,255,.7);
}


/* ================= PARTICLES ================= */

.particle{

    position:fixed;

    border-radius:50%;

    background:#ff5cab;

    box-shadow:
        0 0 6px #ff1493,
        0 0 14px #ff1493;

    pointer-events:none;

    animation:
        floatUp linear infinite;
}

@keyframes floatUp{

    from{
        transform:translate3d(0,110vh,0);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    85%{
        opacity:.8;
    }

    to{
        transform:translate3d(0,-10vh,0);
        opacity:0;
    }
}


/* ================= CREDIT ================= */

.credit{

    position:fixed;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    padding:9px 21px;

    border-radius:30px;

    border:1px solid rgba(255,72,166,.7);

    background:
        rgba(255,20,147,.08);

    box-shadow:
        0 0 12px rgba(255,20,147,.35),
        inset 0 0 15px rgba(255,20,147,.08);

    backdrop-filter:blur(10px);

    color:rgba(255,255,255,.65);

    font-size:9px;

    letter-spacing:3px;

    white-space:nowrap;
}

.name{

    color:#ff69b4;

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:
        0 0 7px #ff1493,
        0 0 16px #ff1493;
}

.heartIcon{

    color:#ff4fa3;

    font-size:13px;

    filter:
        drop-shadow(0 0 6px #ff1493);

    animation:beat 1.4s ease-in-out infinite;
}

@keyframes beat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.25);
    }
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .scene{
        width:110vw;
        height:68vh;
    }

    .love{
        font-size:6.5px;
    }

    .center h1{
        font-size:31px;
    }

    .center p{
        font-size:8px;
        letter-spacing:3px;
    }

    .credit{
        bottom:10px;
        padding:8px 14px;
        font-size:7px;
        gap:8px;
    }
}
</style>
</head>


<body>


<div class="glow"></div>


<div class="title">
    I Love You ❤️
</div>


<div class="scene">

    <div class="heart" id="heart">

        <div class="center">

            <h1>I LOVE YOU</h1>

            <p>
                FOREVER • ALWAYS • ❤️
            </p>

        </div>

    </div>

</div>


<div class="credit">

    <span class="heartIcon">♥</span>

    <span>MADE WITH LOVE BY</span>

    <span class="name">ROBIUL</span>

    <span class="heartIcon">♥</span>

</div>


<script>

/* =========================================
   SETTINGS
========================================= */

const heart =
    document.getElementById("heart");

const TOTAL =
    1000;


/* =========================================
   HEART SETUP
========================================= */

const words=[];


/* =========================================
   CREATE WORDS
========================================= */

for(let i=0;i<TOTAL;i++){

    const word =
        document.createElement("div");

    word.className="love";

    word.textContent =
        i % 12 === 0
        ? "I LOVE YOU ♥"
        : "I love you";

    heart.appendChild(word);

    words.push(word);
}


/* =========================================
   HEART MATHEMATICAL PATH
========================================= */

function getHeartPoint(t,scale,cx,cy){

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    return {

        x:cx + x*scale,

        y:cy - y*scale
    };
}


/* =========================================
   ANIMATION
========================================= */

let startTime =
    performance.now();


function animate(now){

    const elapsed =
        now - startTime;


    /*
       MUCH SLOWER MOVEMENT

       This is the main change
       that makes the words look smooth.
    */

    const movement =
        elapsed * 0.000055;


    const width =
        heart.clientWidth;

    const height =
        heart.clientHeight;


    const cx =
        width/2;

    const cy =
        height/2;


    const scale =
        Math.min(
            width,
            height
        ) / 38;


    for(let i=0;i<words.length;i++){

        const word =
            words[i];


        /*
           Each word has a fixed
           position around the heart.

           They move continuously
           instead of jumping.
        */

        const baseAngle =
            (i / TOTAL) *
            Math.PI * 2;


        const angle =
            baseAngle + movement;


        const point =
            getHeartPoint(
                angle,
                scale,
                cx,
                cy
            );


        /*
           Very tiny floating movement.
           Makes the whole thing feel alive.
        */

        const smoothWave =
            Math.sin(
                angle * 6
            ) * 0.7;


        const x =
            point.x + smoothWave;

        const y =
            point.y + smoothWave;


        /*
           IMPORTANT:

           Text NEVER rotates.

           So "I love you"
           always stays readable.
        */

        word.style.transform =
            `translate3d(
                ${x}px,
                ${y}px,
                0
            ) translate(-50%,-50%)`;


        /*
           Gentle brightness
        */

        word.style.opacity =
            0.62 +
            Math.sin(
                angle * 4
            ) * 0.18;
    }


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);


/* =========================================
   BACKGROUND STARS
========================================= */

for(let i=0;i<120;i++){

    const p =
        document.createElement("div");

    p.className="particle";


    const size =
        1 + Math.random()*3;

    p.style.width =
        size+"px";

    p.style.height =
        size+"px";

    p.style.left =
        Math.random()*100+"vw";

    p.style.animationDuration =
        (7+Math.random()*12)+"s";

    p.style.animationDelay =
        (-Math.random()*15)+"s";


    document.body.appendChild(p);
}

</script>

</body>
</html>
