<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Jannat ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
    radial-gradient(circle at 50% 70%,
    #260018 0%,
    #0d000b 42%,
    #000 100%);
    font-family:Arial,sans-serif;
    color:white;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#030003;
    transition:opacity 1.5s ease;
}

.loader{
    width:270px;
    padding:30px;
    text-align:center;
    border-radius:24px;
    background:rgba(25,5,18,.8);
    border:1px solid rgba(255,70,150,.2);
    box-shadow:
    0 0 50px rgba(255,0,110,.15),
    inset 0 0 30px rgba(255,0,110,.05);
}

.loader-flower{
    font-size:42px;
    animation:pulse 2s infinite;
}

.loader-title{
    margin-top:10px;
    font-family:Georgia,serif;
    font-size:23px;
}

.loader-small{
    margin-top:14px;
    font-size:9px;
    letter-spacing:3px;
    color:#a994a2;
}

.bar{
    height:4px;
    margin-top:16px;
    border-radius:20px;
    background:#25141f;
    overflow:hidden;
}

.bar span{
    display:block;
    height:100%;
    width:0;
    background:linear-gradient(90deg,#ff176f,#ff9acb);
    box-shadow:0 0 15px #ff287f;
    animation:loading 4s linear forwards;
}

@keyframes loading{
    to{width:100%}
}

@keyframes pulse{
    50%{transform:scale(1.12)}
}


/* ================= SCENE ================= */

#scene{
    position:fixed;
    inset:0;
    opacity:0;
    transition:opacity 2s ease;
}

.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#ff70b5;
    box-shadow:0 0 8px #ff2380;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15}
    to{opacity:1}
}


/* ================= GROUND ================= */

.ground{
    position:absolute;
    left:50%;
    bottom:5%;
    width:480px;
    height:100px;
    transform:translateX(-50%);
    border-radius:50%;
    background:
    radial-gradient(ellipse,
    rgba(255,20,120,.24),
    rgba(255,0,100,.08) 45%,
    transparent 70%);
    filter:blur(10px);
}


/* ================= TREE ================= */

.tree{
    position:absolute;
    left:50%;
    bottom:8%;
    width:280px;
    height:520px;
    transform:translateX(-50%);

    /* গাছ চলে যাওয়ার animation */
    animation:
    treeDisappear 2.2s ease-in 8.2s forwards;
}


/* MAIN STEM */

.trunk{
    position:absolute;
    bottom:0;
    left:50%;
    width:13px;
    height:0;
    transform:translateX(-50%);
    transform-origin:bottom;

    background:
    linear-gradient(
        90deg,
        #20100c,
        #70402a,
        #b56a40,
        #3b2118
    );

    border-radius:100px;

    box-shadow:
    0 0 8px rgba(120,60,35,.3);

    animation:
    trunkGrow 3.5s cubic-bezier(.2,.8,.2,1)
    4.5s forwards;
}

@keyframes trunkGrow{
    to{
        height:350px;
    }
}


/* BRANCHES */

.branch{
    position:absolute;
    height:8px;
    border-radius:100px;
    background:
    linear-gradient(
        90deg,
        #321810,
        #8a5033
    );
    transform-origin:left center;
    opacity:0;
}

.branch1{
    width:120px;
    left:50%;
    bottom:190px;
    transform:rotate(-32deg) scaleX(0);
    animation:branchGrow 1.5s ease 6s forwards;
}

.branch2{
    width:115px;
    left:50%;
    bottom:245px;
    transform:rotate(35deg) scaleX(0);
    animation:branchGrow 1.5s ease 6.3s forwards;
}

.branch3{
    width:90px;
    left:50%;
    bottom:295px;
    transform:rotate(-25deg) scaleX(0);
    animation:branchGrow 1.5s ease 6.6s forwards;
}

@keyframes branchGrow{
    to{
        opacity:1;
        transform:rotate(var(--r,0deg)) scaleX(1);
    }
}


/* ================= LEAVES ================= */

.leaves{
    position:absolute;
    inset:0;
}

.leaf{
    position:absolute;
    width:72px;
    height:38px;
    border-radius:100% 0 100% 0;

    background:
    radial-gradient(
        ellipse at 40% 30%,
        #7bcf8a,
        #267445 55%,
        #103522
    );

    box-shadow:
    inset 0 0 8px rgba(255,255,255,.1),
    0 0 10px rgba(40,160,80,.15);

    opacity:0;
    transform:scale(0);
}

.l1{
    left:48px;
    bottom:195px;
    rotate:-25deg;
    animation:leafAppear 1.2s ease 6.2s forwards;
}

.l2{
    right:40px;
    bottom:245px;
    rotate:25deg;
    animation:leafAppear 1.2s ease 6.4s forwards;
}

.l3{
    left:68px;
    bottom:285px;
    rotate:-35deg;
    animation:leafAppear 1.2s ease 6.7s forwards;
}

.l4{
    right:75px;
    bottom:315px;
    rotate:30deg;
    animation:leafAppear 1.2s ease 6.9s forwards;
}

@keyframes leafAppear{
    0%{
        opacity:0;
        transform:scale(0) rotate(-20deg);
    }
    70%{
        opacity:1;
        transform:scale(1.12) rotate(3deg);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}


/* ================= FLOWER ================= */

.flower{
    position:absolute;
    left:50%;
    bottom:340px;
    width:130px;
    height:130px;
    transform:translateX(-50%) scale(.05);
    opacity:0;

    animation:
    flowerBloom 2s cubic-bezier(.2,.9,.2,1)
    7.1s forwards;
}

.petal{
    position:absolute;
    left:50%;
    top:50%;
    width:58px;
    height:92px;

    transform-origin:50% 90%;

    border-radius:
    60% 60% 48% 48%;

    background:
    radial-gradient(
        ellipse at 40% 20%,
        #ffd0e5,
        #ff5aa5 40%,
        #c90062 75%,
        #62002e
    );

    box-shadow:
    inset 0 0 10px rgba(255,255,255,.25),
    0 0 18px rgba(255,0,120,.25);
}

.p1{transform:translate(-50%,-90%) rotate(0deg)}
.p2{transform:translate(-50%,-90%) rotate(60deg)}
.p3{transform:translate(-50%,-90%) rotate(120deg)}
.p4{transform:translate(-50%,-90%) rotate(180deg)}
.p5{transform:translate(-50%,-90%) rotate(240deg)}
.p6{transform:translate(-50%,-90%) rotate(300deg)}

.flower-center{
    position:absolute;
    left:50%;
    top:50%;
    width:40px;
    height:40px;
    transform:translate(-50%,-50%);
    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #ffe99b,
        #ff9c24 50%,
        #8c3000
    );

    box-shadow:
    0 0 18px rgba(255,170,40,.7);
}

@keyframes flowerBloom{

    0%{
        opacity:0;
        transform:translateX(-50%) scale(.05);
    }

    60%{
        opacity:1;
        transform:translateX(-50%) scale(1.12);
    }

    100%{
        opacity:1;
        transform:translateX(-50%) scale(1);
    }
}


/* ================= TREE DISAPPEARS ================= */

@keyframes treeDisappear{

    0%{
        opacity:1;
        transform:translateX(-50%) scale(1);
        filter:blur(0);
    }

    45%{
        opacity:.8;
        transform:translateX(-50%) scale(.98);
        filter:blur(1px);
    }

    75%{
        opacity:.35;
        transform:translateX(-50%) scale(.94) translateY(15px);
        filter:blur(3px);
    }

    100%{
        opacity:0;
        transform:translateX(-50%) scale(.88) translateY(35px);
        filter:blur(8px);
    }
}


/* ================= MESSAGE ================= */

.message{
    position:absolute;
    left:50%;
    top:48%;
    width:100%;
    text-align:center;

    opacity:0;

    transform:
    translate(-50%,35px)
    scale(.94);

    animation:
    messageAppear
    2.4s cubic-bezier(.2,.8,.2,1)
    10.1s forwards;
}

.title{
    font-size:clamp(38px,7vw,82px);
    font-weight:700;
    letter-spacing:6px;

    background:
    linear-gradient(
        90deg,
        #ff5ca9,
        #fff,
        #ff5ca9
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
    0 0 20px rgba(255,40,140,.45),
    0 0 45px rgba(255,0,120,.2);
}

.name{
    margin-top:15px;

    font-size:clamp(15px,2.5vw,25px);

    letter-spacing:9px;

    color:#f6dcea;

    text-shadow:
    0 0 15px rgba(255,60,160,.6);
}

.line{
    width:90px;
    height:1px;
    margin:22px auto;

    background:
    linear-gradient(
        90deg,
        transparent,
        #ff58a8,
        transparent
    );

    box-shadow:0 0 10px #ff318a;
}

.forever{
    font-size:11px;
    letter-spacing:7px;
    color:#a994a4;
}

@keyframes messageAppear{

    0%{
        opacity:0;
        transform:
        translate(-50%,55px)
        scale(.92);
        filter:blur(12px);
    }

    55%{
        opacity:.75;
        filter:blur(3px);
    }

    100%{
        opacity:1;
        transform:
        translate(-50%,0)
        scale(1);
        filter:blur(0);
    }
}


/* ================= FOOTER ================= */

.footer{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);

    padding:10px 24px;

    border:1px solid rgba(255,60,150,.45);
    border-radius:30px;

    color:#b9a9b3;
    font-size:9px;
    letter-spacing:3px;

    background:rgba(30,0,20,.35);

    box-shadow:
    0 0 20px rgba(255,0,120,.12);
}

.footer b{
    color:#ff62ad;
}


/* MOBILE */

@media(max-width:600px){

    .tree{
        transform:translateX(-50%) scale(.75);
        transform-origin:bottom center;
    }

    .message{
        top:45%;
    }

    .title{
        letter-spacing:3px;
    }

    .name{
        letter-spacing:5px;
    }

    .footer{
        font-size:7px;
        letter-spacing:2px;
    }
}
</style>
</head>


<body>

<!-- LOADING -->

<div id="loading">

    <div class="loader">

        <div class="loader-flower">🌹</div>

        <div class="loader-title">
            Love.css
        </div>

        <div class="bar">
            <span></span>
        </div>

        <div class="loader-small">
            GROWING DIGITAL PETALS...
        </div>

    </div>

</div>


<!-- SCENE -->

<div id="scene">

    <div class="stars" id="stars"></div>

    <div class="ground"></div>


    <!-- TREE -->

    <div class="tree">

        <div class="trunk"></div>

        <div class="branch branch1"></div>
        <div class="branch branch2"></div>
        <div class="branch branch3"></div>

        <div class="leaves">

            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>

        </div>


        <!-- FLOWER -->

        <div class="flower">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>

            <div class="flower-center"></div>

        </div>

    </div>


    <!-- MESSAGE -->

    <div class="message">

        <div class="title">
            I LOVE YOU
        </div>

        <div class="line"></div>

        <div class="name">
            FAVORITE JANNAT ♥
        </div>

        <div class="forever">
            FOREVER · ALWAYS · LOVE
        </div>

    </div>


    <div class="footer">
        ♥ MADE WITH LOVE BY <b>ROBIUL</b> ♥
    </div>

</div>


<script>

/* STARS */

const stars=document.getElementById("stars");

for(let i=0;i<100;i++){

    const s=document.createElement("div");

    s.className="star";

    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";

    const size=1+Math.random()*3;

    s.style.width=size+"px";
    s.style.height=size+"px";

    s.style.animationDelay=Math.random()*3+"s";

    stars.appendChild(s);
}


/* START SCENE */

setTimeout(()=>{

    document.getElementById("loading").style.opacity="0";

    document.getElementById("scene").style.opacity="1";

    setTimeout(()=>{

        document.getElementById("loading").style.display="none";

    },1600);

},4300);

</script>

</body>
</html>
