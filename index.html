<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 48%,
            #300b29 0%,
            #160714 38%,
            #050205 72%,
            #000000 100%
        );

    font-family:Arial,Helvetica,sans-serif;
}


/* =========================
   BACKGROUND GLOW
========================= */

.glow{
    position:fixed;

    width:650px;
    height:650px;

    left:50%;
    top:51%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,20,147,.18),
            rgba(255,20,147,.07) 40%,
            transparent 70%
        );

    filter:blur(35px);

    animation:
        glowPulse 5s ease-in-out infinite;

    pointer-events:none;
}

@keyframes glowPulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.92);
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }
}


/* =========================
   TOP TITLE
========================= */

.title{

    position:fixed;

    top:28px;
    left:50%;

    transform:translateX(-50%);

    z-index:20;

    white-space:nowrap;

    font-size:
        clamp(28px,4vw,46px);

    font-weight:700;

    letter-spacing:2px;

    background:
        linear-gradient(
            90deg,
            #ff4b9b,
            #ffffff,
            #ff4b9b
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(0 0 8px #ff1493)
        drop-shadow(0 0 22px #ff1493);
}


/* =========================
   CANVAS
========================= */

canvas{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    pointer-events:none;
}


/* =========================
   CENTER MESSAGE
========================= */

.center{

    position:fixed;

    left:50%;
    top:53%;

    transform:
        translate(-50%,-50%);

    z-index:10;

    text-align:center;

    pointer-events:none;
}

.center h1{

    font-size:
        clamp(35px,6vw,64px);

    letter-spacing:3px;

    font-weight:700;

    white-space:nowrap;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #ffb8dc,
            #ff3c9f
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(0 0 8px #ff1493)
        drop-shadow(0 0 25px #ff1493);
}

.center p{

    margin-top:12px;

    font-size:11px;

    letter-spacing:6px;

    color:
        rgba(255,255,255,.72);
}


/* =========================
   CREDIT
========================= */

.credit{

    position:fixed;

    left:50%;
    bottom:20px;

    transform:
        translateX(-50%);

    z-index:30;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    padding:9px 20px;

    border:
        1px solid
        rgba(255,72,166,.65);

    border-radius:30px;

    background:
        rgba(255,20,147,.08);

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 0 12px
        rgba(255,20,147,.35),

        inset 0 0 14px
        rgba(255,20,147,.08);

    color:
        rgba(255,255,255,.68);

    font-size:9px;

    letter-spacing:3px;

    white-space:nowrap;
}

.credit .heart{

    color:#ff4fa3;

    font-size:14px;

    filter:
        drop-shadow(0 0 6px #ff1493);

    animation:
        heartbeat 1.4s ease-in-out infinite;
}

.credit .name{

    color:#ff70b8;

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:
        0 0 7px #ff1493,
        0 0 14px #ff1493;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.25);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .title{
        top:22px;
        font-size:28px;
    }

    .center h1{
        font-size:32px;
    }

    .center p{
        font-size:8px;
        letter-spacing:3px;
    }

    .credit{
        bottom:12px;
        padding:8px 14px;
        font-size:7px;
    }

    .credit .name{
        letter-spacing:3px;
    }
}
</style>
</head>


<body>


<div class="glow"></div>


<div class="title">
    I Love You ❤️
</div>


<canvas id="heartCanvas"></canvas>


<div class="center">

    <h1>
        I LOVE YOU
    </h1>

    <p>
        FOREVER • ALWAYS • ❤️
    </p>

</div>


<div class="credit">

    <span class="heart">♥</span>

    <span>MADE WITH LOVE BY</span>

    <span class="name">ROBIUL</span>

    <span class="heart">♥</span>

</div>


<script>

/* ==========================================
   CANVAS SETUP
========================================== */

const canvas =
    document.getElementById("heartCanvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;


/* ==========================================
   RESIZE
========================================== */

function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ==========================================
   HEART PARAMETRIC EQUATION
========================================== */

function heartPoint(t, scale){

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    return {

        x: x * scale,

        y: -y * scale
    };
}


/* ==========================================
   HEART SIZE
========================================== */

function getScale(){

    return Math.min(
        W,
        H
    ) * 0.0205;
}


/* ==========================================
   HEART CENTER
========================================== */

function getCenter(){

    return {

        x: W / 2,

        y:
            H * 0.53
    };
}


/* ==========================================
   MANY I LOVE YOU
========================================== */

const TOTAL =
    700;


/* ==========================================
   PARTICLES
========================================== */

const particles = [];

for(let i=0;i<100;i++){

    particles.push({

        x:
            Math.random() * W,

        y:
            Math.random() * H,

        size:
            1 + Math.random()*2.5,

        speed:
            .08 + Math.random()*.25,

        alpha:
            .25 + Math.random()*.7
    });
}


/* ==========================================
   DRAW BACKGROUND PARTICLES
========================================== */

function drawParticles(){

    for(const p of particles){

        p.y -= p.speed;

        if(p.y < -10){

            p.y =
                H + 10;

            p.x =
                Math.random()*W;
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(255,80,180,${p.alpha})`;

        ctx.shadowColor =
            "#ff1493";

        ctx.shadowBlur =
            10;

        ctx.fill();
    }

    ctx.shadowBlur = 0;
}


/* ==========================================
   MAIN ANIMATION
========================================== */

let time = 0;


/*
   This is intentionally slow.

   The small "I love you"
   move smoothly around
   the heart.

   They DO NOT rotate.
*/

function animate(){

    requestAnimationFrame(
        animate
    );

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawParticles();


    const center =
        getCenter();

    const scale =
        getScale();


    /*
       Very smooth movement.
    */

    time += 0.00075;


    /* ======================================
       DRAW 700 SMALL WORDS
    ====================================== */

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        "bold 8px Arial";


    for(let i=0;i<TOTAL;i++){

        /*
           Evenly distribute words.
        */

        const base =
            (i / TOTAL) *
            Math.PI * 2;


        /*
           Smooth movement.
        */

        const t =
            base + time;


        const pos =
            heartPoint(
                t,
                scale
            );


        const x =
            center.x + pos.x;

        const y =
            center.y + pos.y;


        /*
           Slight natural brightness.
        */

        const alpha =
            .45 +
            (
                Math.sin(
                    t * 2.2
                ) + 1
            ) * .22;


        /*
           Glow.
        */

        ctx.shadowColor =
            "#ff1493";

        ctx.shadowBlur =
            7;


        ctx.fillStyle =
            `rgba(255,180,220,${alpha})`;


        /*
           IMPORTANT:

           No rotate() here.

           So every "I love you"
           remains straight.
        */

        ctx.fillText(
            "I love you",
            x,
            y
        );
    }


    ctx.shadowBlur = 0;
}


/* ==========================================
   START
========================================== */

animate();

</script>

</body>
</html>
